plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.textlocator'
version = '1.0.0'

android {
  namespace "expo.modules.textlocator"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Same ML Kit text model as expo-text-extractor (downloaded by Google Play services).
  implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
  implementation 'androidx.exifinterface:exifinterface:1.3.7'
}
